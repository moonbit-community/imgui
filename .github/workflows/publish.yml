name: Publish Mooncakes
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libglfw3-dev libgl1-mesa-dev pkg-config
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- nightly
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon version --all
      - run: moon update
      - run: moon check --deny-warn --target native
      - run: moon test --target native --jobs 1
      - name: Publish verified module
        env:
          MOONCAKES_CREDENTIALS: ${{ secrets.MOONCAKES_MOONBIT_COMMUNITY_TOKEN }}
        run: |
          test -n "$MOONCAKES_CREDENTIALS" || { echo "Missing organization Mooncakes publishing credentials"; exit 1; }
          trap 'rm -f "$HOME/.moon/credentials.json"' EXIT
          printf '%s' "$MOONCAKES_CREDENTIALS" > "$HOME/.moon/credentials.json"
          moon publish --dry-run
          moon publish
